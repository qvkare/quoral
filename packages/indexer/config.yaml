# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Envio HyperIndex for Quoral. Agreements are discovered from AgreementFactory.AgreementCreated
# (vault / heartbeat / paystream registered dynamically). Serves the public Liquidity Terms page.
# This file indexes the public Monad testnet demo (contracts/deployments/10143.json); config.local.yaml indexes anvil.
name: quoral
unordered_multichain_mode: true
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: AgreementFactory
    abi_file_path: abis/AgreementFactory.json
    handler: src/EventHandlers.ts
    events:
      - event: AgreementCreated
  - name: RFQAuction
    abi_file_path: abis/RFQAuction.json
    handler: src/EventHandlers.ts
    events:
      - event: RFQOpened
      - event: BidPlaced
      - event: BidWithdrawn
      - event: Awarded
      - event: RFQCancelled
  - name: DisclosureRegistry
    abi_file_path: abis/DisclosureRegistry.json
    handler: src/EventHandlers.ts
    events:
      - event: Disclosed
      - event: URIUpdated
  - name: BondVault
    abi_file_path: abis/BondVault.json
    handler: src/EventHandlers.ts
    events:
      - event: Assigned
      - event: Slashed
      - event: Released
  - name: InventoryVault
    abi_file_path: abis/InventoryVault.json
    handler: src/EventHandlers.ts
    events:
      - event: Requoted
      - event: NoticeGiven
      - event: OperatorChanged
      - event: InventoryWithdrawn
      - event: Finalized
      - event: InventoryLimited
      - event: InventoryAdded
  - name: Heartbeat
    abi_file_path: abis/Heartbeat.json
    handler: src/EventHandlers.ts
    events:
      - event: HeartbeatRecorded
      - event: EpochExcused
      - event: EpochSettled
      - event: UptimeBreached
  - name: Paystream
    abi_file_path: abis/Paystream.json
    handler: src/EventHandlers.ts
    events:
      - event: Clawback
      - event: Claimed
      - event: Refunded
  - name: KuruOrderBook
    abi_file_path: abis/IKuruOrderBook.json
    handler: src/EventHandlers.ts
    events:
      - event: Trade

networks:
  # Monad testnet. The public RPC caps eth_getLogs at 100 blocks, so ranges stay at 100. With a HyperSync API token
  # (app.envio.dev/api-tokens, set ENVIO_API_TOKEN) replace rpc_config with: hypersync_config: { url: https://10143.hypersync.xyz }
  - id: 10143
    start_block: 68988042
    rpc_config:
      url: https://testnet-rpc.monad.xyz
      initial_block_interval: 100
      interval_ceiling: 100
      backoff_millis: 1000
    contracts:
      - name: AgreementFactory
        address: ["0x6aca764607C1E69f82C4D81042392D7E194eF399"]
      - name: RFQAuction
        address: ["0xDcc21CEA6741ae2fE3cB23664Fe5a4e519ed5102"]
      - name: DisclosureRegistry
        address: ["0xF285e1f2B7FB006486Ec8D6CC6c586c67aA404e4"]
      - name: BondVault
        address: ["0x8cc867C50470B0aB6689646f715bc6611A028F4e"]
      - name: KuruOrderBook # test order book with the Kuru v1 interface
        address: ["0xE44258d4B78cfB25f7cBB7a0630f6d785616aa16"]
      - name: InventoryVault
      - name: Heartbeat
      - name: Paystream
  # Monad mainnet via HyperSync: fill from contracts/deployments/143.json after `forge script Deploy`
  # - id: 143
  #   start_block: <deploy block>
  #   contracts: same names, with the mainnet factory / rfq / registry / bondVault and Kuru market addresses
