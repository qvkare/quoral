[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[fmt]
line_length = 120

[lint]
lint_on_build = false
